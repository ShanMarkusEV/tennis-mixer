const gName = id => (game.players.find(p => p.id === id) || {name: '?'}).name;
const gPhoto = id => (game.players.find(p => p.id === id) || {}).photo || null;
// Where the player is right now: waiting, playing (court, team, opponents, score), sitting out, or done.
function spot(g = game, me = follow.me) {
  const n = g.rounds.length, rd = g.rounds[n - 1];
  if (g.finished) return {kind: 'finished', n};
  if (!rd) return {kind: 'waiting', n: 0};
  const ci = rd.matches.findIndex(m => m.a.includes(me) || m.b.includes(me));
  if (ci < 0) return {kind: rd.sitting.includes(me) ? 'sitting' : 'out', n};
  const m = rd.matches[ci], a = m.a.includes(me);
  return {kind: 'playing', n, court: ci + 1, mine: a ? m.a : m.b, theirs: a ? m.b : m.a, my: a ? m.sa : m.sb, their: a ? m.sb : m.sa};
}
const spotSig = g => { const s = spot(g); return JSON.stringify([s.kind, s.n, s.court, s.mine, s.theirs]); };
function spotLine(s) {
  const others = ids => ids.filter(id => id !== follow.me).map(gName).join(' & ');
  if (s.kind === 'playing') return {title: `Round ${s.n} · Court ${s.court}: you're on!`, body: `${others(s.mine) ? `You & ${others(s.mine)}` : 'You'} vs ${others(s.theirs)}`};
  if (s.kind === 'sitting') return {title: `Round ${s.n}: you sit out`, body: "You're likely on next round."};
  if (s.kind === 'finished') return {title: `${game.title || 'The game'} is finished`, body: 'Final standings are in.'};
  return {title: game.title || '10nis game', body: 'Your game has an update.'};
}
function alertSpot() {
  const msg = spotLine(spot());
  try { if (navigator.vibrate) navigator.vibrate([120, 60, 120]); } catch (e) {}
  if (document.hidden && !follow.push && window.Notification && Notification.permission === 'granted' && 'serviceWorker' in navigator)
    navigator.serviceWorker.ready.then(r => r.showNotification(msg.title, {body: msg.body, icon: '/icon-192.png',
      tag: '10nis-' + follow.pin, renotify: true, data: {url: '/j/' + follow.pin}})).catch(() => {});
  else toast(msg.title);
  flash = true;
}

async function joinGame() {
  const v = String(joinPin).replace(/\D/g, '');
  if (!/^[1-9]\d{5}$/.test(v)) { toast('Game PINs have 6 digits'); return; }
  if (follow.pin !== v) { follow = {pin: v}; game = null; track('join', {via: 'pin'}); }
  gameErr = null; joinPin = ''; saveFollow();
  render(); await loadGame();
}
async function pickMe(id) {
  follow.me = id; saveFollow(); flash = false; render(); window.scrollTo(0, 0);
  if (follow.push) await sb.rpc('follow_push', {p: follow.pin, who: id, ep: follow.push});
}
async function leaveGame() {
  if (!confirm('Leave this game? You can join again with the PIN.')) return;
  if (follow.push && sb) await sb.rpc('unfollow_push', {ep: follow.push});
  follow = {}; game = null; gameErr = null; saveFollow(); render();
}
const pushable = () => 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
const b64uBytes = s => Uint8Array.from(atob(s.replace(/-/g, '+').replace(/_/g, '/')), c => c.charCodeAt(0));
async function enablePush() {
  if (!pushable()) {
    toast(isIOS && !standalone() ? 'On iPhone, add 10nis to your Home Screen first, then open it from there' : "This browser can't show notifications");
    return;
  }
  if (await Notification.requestPermission() !== 'granted') { toast('Notifications are blocked. Allow them for 10nis.win in your settings'); return; }
  try {
    const reg = await navigator.serviceWorker.ready;
    const sub = await reg.pushManager.getSubscription()
      || await reg.pushManager.subscribe({userVisibleOnly: true, applicationServerKey: b64uBytes(VAPID_PUBLIC_KEY)});
    const {error} = await sb.rpc('follow_push', {p: follow.pin, who: follow.me, ep: sub.endpoint});
    if (error) throw error;
    follow.push = sub.endpoint; saveFollow(); render();
    toast("You'll get a notification every round");
  } catch (e) { report('push', e.message); toast(e.message || "Couldn't turn on notifications"); }
}
async function disablePush() {
  if (follow.push && sb) await sb.rpc('unfollow_push', {ep: follow.push});
  follow.push = null; saveFollow(); render();
}
async function claimFromGame() {
  const p = game.players.find(x => x.id === follow.me);
  if (!confirm(`Are you ${p.name}? Results under this name will count towards your 10nis level.`)) return;
  const {error} = await sb.rpc('claim_by_pin', {p: follow.pin, local_id: follow.me});
  if (error) { toast(error.message); return; }
  toast(`You're linked as ${p.name}`); me = null; loadGame();
}

function viewJoin() {
  if (!follow.pin || gameErr === 'expired') return `
    <p class="kicker">Playing, not hosting?</p>
    <h1 class="title">Join a game</h1>
    <p class="sub">Enter the game PIN from your host. You'll see your court, partner and opponents every round.</p>
    ${gameErr === 'expired' ? `<p class="hint warn">${ic('x')}No active game with PIN ${esc(pinText(follow.pin))}. Check the number with your host.</p>` : ''}
    <div class="card joincard">
      <input id="pin" class="pinin num" inputmode="numeric" autocomplete="one-time-code" maxlength="7" placeholder="000 000"
        aria-label="Game PIN" value="${esc(joinPin)}" oninput="joinPin = this.value" onkeydown="if (event.key === 'Enter') joinGame()">
      <button class="btn primary big" onclick="joinGame()">Join game${ic('arrow')}</button>
    </div>
    <p class="muted" style="text-align:center;margin-top:12px">No account needed. Hosting today? Get a PIN on the Players tab.</p>`;
  if (!game) {
    if (!gameErr) { loadGame(); return '<p class="muted" style="padding:20px 4px">Loading game…</p>'; }
    return `<div class="empty"><h3>${esc(gameErr)}</h3><button class="btn" onclick="gameErr = null; loadGame()">Try again</button></div>`;
  }
  const when = game.starts_at
    ? new Date(game.starts_at).toLocaleString('en', {weekday: 'short', day: 'numeric', month: 'short', hour: 'numeric', minute: '2-digit'})
    : new Date(game.played_on + 'T00:00').toLocaleDateString('en', {weekday: 'short', day: 'numeric', month: 'short'});
  const head = `<p class="kicker">PIN ${esc(pinText(game.pin))}${game.host ? ` · Hosted by ${esc(game.host)}` : ''}</p>
    <h1 class="title">${esc(game.title || 'Tennis game')}</h1>
    <div class="meta"><span>${ic('clock')}${esc(when)}</span>${game.venue ? `<span>${ic('pin')}${esc(game.venue)}</span>` : ''}<span>${esc(modeName(game.mode))}</span></div>`;
  const meP = game.players.find(p => p.id === follow.me);
  if (!meP) return `${head}
    <div class="sec-head"><p class="label">Who are you?</p></div>
    <div class="card plist">${game.players.map(p => `<div class="player">${avatar(p.name, '', p.photo)}
      <span class="grow" style="font-weight:700;overflow-wrap:anywhere">${esc(p.name)}</span>
      <button class="btn sm soft" onclick="pickMe('${esc(p.id)}')">That's me</button></div>`).join('')}</div>
    <div class="row" style="justify-content:center;margin-top:16px"><button class="btn text" onclick="leaveGame()">Leave game</button></div>`;

  const s = spot();
  const side = (ids, sc) => `<div class="side"><div class="duo">${ids.map(id => `<span class="pn">${avatar(gName(id), 'sm', gPhoto(id))}<span class="nm">${id === follow.me ? 'You' : esc(gName(id))}</span></span>`).join('')}</div>
    <b class="sc num">${sc ?? '–'}</b></div>`;
  const rows = standingsRows(game.players, game.rounds, 'pts');
  const place = rows.findIndex(r => r.id === follow.me) + 1;
  const hero = s.kind === 'playing' ? `<div class="hero court ${flash ? 'flash' : ''}">
      <div class="herohead"><span class="chipd">Round ${s.n}</span><span class="live"><i></i>Live</span></div>
      <div class="big">Court ${s.court}</div>
      <div class="vs">${side(s.mine, s.my)}<div class="vsl"><span>VS</span></div>${side(s.theirs, s.their)}</div></div>`
    : `<div class="hero rest ${flash ? 'flash' : ''}">
      <div class="herohead"><span class="chipd">${s.kind === 'finished' ? 'Final' : s.n ? `Round ${s.n}` : 'Before round 1'}</span></div>
      <div class="big">${s.kind === 'finished' ? (place ? `#${place}` : 'Done') : s.kind === 'sitting' ? 'Sit out' : s.kind === 'out' ? 'Not playing' : 'Warm up'}</div>
      <p>${s.kind === 'finished' ? `${place ? `You finished ${place} of ${rows.length}. ` : ''}Final standings are below.`
        : s.kind === 'sitting' ? "Grab some water. You're likely on next round."
        : s.kind === 'out' ? "The host has you marked as not playing right now."
        : "The host hasn't started yet. Your court shows here as soon as round 1 starts."}</p></div>`;
  flash = false;
  const played = game.rounds.map((rd, ri) => {
    const ci = rd.matches.findIndex(m => m.a.includes(follow.me) || m.b.includes(follow.me));
    if (ci < 0) return null;
    const m = rd.matches[ci], a = m.a.includes(follow.me), my = a ? m.sa : m.sb, their = a ? m.sb : m.sa;
    const others = ids => ids.filter(id => id !== follow.me).map(id => esc(gName(id))).join(' & ');
    const res = my == null || their == null ? '' : my > their ? 'W' : my < their ? 'L' : 'D';
    return `<div class="mmrow"><span class="res ${res}">${res || '·'}</span><span class="num sc">${res ? `${my}–${their}` : `R${ri + 1}`}</span>
      <span class="grow">${others(a ? m.a : m.b) ? `with ${others(a ? m.a : m.b)} ` : ''}vs ${others(a ? m.b : m.a)}</span>
      <small class="muted">R${ri + 1} · C${ci + 1}</small></div>`;
  }).filter(Boolean).reverse();
  return `${head}${hero}
    ${s.kind !== 'finished' ? `<div class="card notify">${ic('bell')}<span class="grow"><b>${follow.push ? 'Notifications on' : 'Notify me each round'}</b>
      <small>${follow.push ? "We'll ping this phone when your court changes." : isIOS && !standalone() ? 'On iPhone: add 10nis to your Home Screen first, then open it from there.' : 'Know your court the moment the host starts a round.'}</small></span>
      <button class="sw ${follow.push ? 'on' : ''}" role="switch" aria-checked="${!!follow.push}" aria-label="Notifications" onclick="${follow.push ? 'disablePush()' : 'enablePush()'}"></button></div>` : ''}
    ${meP.mine ? `<p class="hint">${ic('ball')}These games count towards your 10nis level.</p>`
      : meP.claimable ? (user ? `<button class="pinbar ghost" onclick="claimFromGame()">${ic('trophy')}<span class="grow"><b>Count these games for my level</b><small>Link ${esc(meP.name)} to your 10nis account</small></span>${ic('arrow')}</button>`
        : `<p class="hint">${ic('trophy')}Sign in under Account to count these games towards your level.</p>`) : ''}
    ${played.length ? `<div class="sec-head"><p class="label">Your games</p></div><div class="card mm">${played.join('')}</div>` : ''}
    ${game.rounds.some(rd => rd.matches.some(hasScore)) ? `<div class="sec-head"><p class="label">Standings</p></div>
    <div class="card" style="padding:0;overflow:hidden"><ol class="lb">${rows.map((r, i) => `<li class="${r.id === follow.me ? 'me-row' : ''}">
      <span class="rank">${i + 1}</span>${avatar(r.name, '', r.photo || null)}
      <span class="who"><b>${r.id === follow.me ? 'You' : esc(r.name)}</b><small>${plural(r.scored, 'match')} · ${r.w}W ${r.l}L</small></span>
      <span class="score"><b class="num">${r.pts}</b><small>games</small></span></li>`).join('')}</ol></div>` : ''}
    <div class="row" style="justify-content:center;gap:16px;margin-top:18px">
      <button class="btn text" onclick="follow.me = null; saveFollow(); render()">Not ${esc(meP.name)}?</button>
      <button class="btn text danger" onclick="leaveGame()">Leave game</button></div>`;
}

if (sb) sb.auth.onAuthStateChange((event, session) => {
  const was = user && user.id;
  user = session ? session.user : null;
  // Supabase also reports SIGNED_IN when it restores a saved login on page load, so only count a sign-in
  // the user just did (Google button, or coming back from the Google redirect).
  try { if (user && sessionStorage.getItem('10nis-signing-in')) { sessionStorage.removeItem('10nis-signing-in'); setTimeout(() => track('signin')); } } catch (e) {}
  // Defer: Supabase calls made inside this callback can deadlock the auth lock.
  if ((user && user.id) !== was) { sessionLog = null; ratingsByPid = {}; me = null; myMatches = null; allMatches = false; claimData = null; codeData = undefined; setTimeout(() => { render(); queueSync(); loadRatings(); if (follow.pin) loadGame(true); }); }
});

function render() {
  if (claimView) {
    document.querySelectorAll('.tabbar button').forEach(b => b.classList.remove('on'));
    document.getElementById('status').innerHTML = '';
    document.getElementById('view').innerHTML = shareToken ? viewClaim() : viewAddCode();
    document.getElementById('dock').innerHTML = '';
    mountGoogleButton();
    return;
  }
  document.querySelectorAll('.tabbar button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  const avail = S.players.filter(p => p.active).length, n = S.rounds.length;
  document.getElementById('status').innerHTML = S.tab === 'join' ? (game && follow.pin ? `<i></i>PIN ${pinText(follow.pin)}` : '')
    : `<i></i>${n ? `Round ${n} · ` : ''}${avail} playing`;
  document.getElementById('view').innerHTML =
    S.tab === 'rounds' ? viewRounds() : S.tab === 'standings' ? viewStandings() : S.tab === 'account' ? viewAccount()
    : S.tab === 'join' ? viewJoin() : viewPlayers();
  if (S.pin && pinOpen && document.getElementById('pinqr')) drawQR('pinqr', `${APP_URL}/j/${S.pin}`);
  mountGoogleButton();
  if (S.tab === 'account' && me && me.code && document.getElementById('mycode')) drawQR('mycode', location.origin + '/p/' + me.code);
  // Main action floats above the tab bar, within thumb reach.
  document.getElementById('dock').innerHTML =
    S.tab === 'rounds' && S.finishedAt ? `<div class="dock"><div class="in">
        <button class="btn primary grow" onclick="doneEditing()">${ic('arrow')}Done</button></div></div>`
    : S.tab === 'rounds' ? `<div class="dock"><div class="in">
        <button class="btn primary grow" onclick="nextRound()">${ic('ball')}Generate round ${n + 1}</button>
        ${n ? `<button class="btn" onclick="undoRound()" aria-label="Undo last round">${ic('undo')}Undo</button>` : ''}</div></div>`
    : S.tab === 'players' ? `<div class="dock"><div class="in">
        <button class="btn primary grow" onclick="goTab('rounds')">${n ? 'Go to rounds' : 'Start playing'}${ic('arrow')}</button></div></div>`
    : '';
}
document.querySelectorAll('.tabbar button').forEach(b => {
  b.querySelector('.pill').innerHTML = ic(b.querySelector('.pill').dataset.ic);
  b.onclick = () => goTab(b.dataset.tab);
});
render();
</script>
</body>
